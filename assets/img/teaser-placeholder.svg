<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Paper teaser placeholder">
  <!-- 论文缩略图占位：加论文时换成真实的 teaser / pipeline 图（16:10，宽 ≥ 640）。
       内嵌 prefers-color-scheme，深色模式下不会变成一块刺眼的白板。 -->
  <style>
    .bg   { fill: #f1f3f5; }
    .box  { fill: #dde1e6; }
    .line { fill: #e6e9ed; }
    .txt  { fill: #a2a9b0; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #1b1f23; }
      .box  { fill: #2f353c; }
      .line { fill: #262b31; }
      .txt  { fill: #6b747d; }
    }
  </style>
  <rect class="bg" width="320" height="200"/>
  <rect class="box"  x="24"  y="26"  width="120" height="72" rx="4"/>
  <rect class="box"  x="156" y="26"  width="140" height="12" rx="3"/>
  <rect class="line" x="156" y="48"  width="112" height="8"  rx="3"/>
  <rect class="line" x="156" y="64"  width="128" height="8"  rx="3"/>
  <rect class="line" x="156" y="80"  width="96"  height="8"  rx="3"/>
  <rect class="line" x="24"  y="118" width="272" height="8"  rx="3"/>
  <rect class="line" x="24"  y="134" width="240" height="8"  rx="3"/>
  <text class="txt" x="160" y="176" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">teaser figure</text>
</svg>
